name: Feature request
description: Something the product should do and does not
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen. Leave empty if you only have the problem.
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Headset, streaming software, trackers and base stations, if it matters.
